<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101820" />
    <meta
      name="description"
      content="오늘의 숨은 시간에 따라 변화하는 자연 속에서 5분부터 시작하는 작은 명상 습관을 만들고, 그 기록을 차곡차곡 쌓아가는 명상 웹앱입니다."
    />
    <title>오늘의 숨</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div id="bg-a" class="bg is-visible"></div>
      <div id="bg-b" class="bg"></div>
      <div class="overlay"></div>
    </div>

    <header class="header">
      <a class="logo" href="#/">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M16 27c.2-7 5.2-12.5 12-15-2.2 7.2-6.4 11.2-12 15z" fill="#7F9B87" />
          <path d="M16 27c-.2-6.2-4.4-10.6-9.5-13 1.2 6.4 4.6 10 9.5 13z" fill="#D8D0C3" />
        </svg>
        <span>오늘의 숨</span>
      </a>
      <nav class="topnav" aria-label="주요 메뉴">
        <a href="#/" data-nav="home">홈</a>
        <a href="#/meditate" data-nav="meditate">명상하기</a>
        <a href="#/music" data-nav="music">명상 음악</a>
        <a href="#/record" data-nav="record">나의 기록</a>
      </nav>
    </header>

    <main id="main">
      <section id="view-home" class="view view-center"></section>
      <section id="view-setup" class="view view-center" hidden></section>
      <section id="view-session" class="view view-center" hidden></section>
      <section id="view-complete" class="view view-center" hidden></section>
      <section id="view-music" class="view view-flow" hidden></section>
      <section id="view-record" class="view view-flow" hidden></section>
    </main>

    <nav class="tabbar" aria-label="주요 메뉴">
      <a href="#/" data-nav="home">홈</a>
      <a href="#/meditate" data-nav="meditate">명상하기</a>
      <a href="#/music" data-nav="music">명상 음악</a>
      <a href="#/record" data-nav="record">나의 기록</a>
    </nav>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-action="end-cancel"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">명상을 종료하시겠어요?</h2>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button type="button" class="primary" id="modal-continue" data-action="end-cancel">계속하기</button>
          <button type="button" class="ghost" data-action="end-confirm">종료하기</button>
        </div>
      </div>
    </div>

    <noscript>
      <p class="noscript">오늘의 숨을 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</p>
    </noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
